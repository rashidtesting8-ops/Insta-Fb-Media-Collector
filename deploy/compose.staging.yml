name: pgm-media-staging

x-runtime: &runtime
  restart: unless-stopped
  init: true
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  collector:
    <<: *runtime
    build:
      context: ../services/media-worker
      dockerfile: Dockerfile
      args:
        INSTALL_PLAYWRIGHT: ${INSTALL_PLAYWRIGHT:-0}
    mem_limit: 1g
    environment:
      PROJECTS_DIR: /data/projects
      MEDIA_WORKER_TOKEN: ${MEDIA_WORKER_TOKEN:?set the staging worker token}
      MEDIA_WORKER_DASHBOARD_TOKEN: ${MEDIA_WORKER_DASHBOARD_TOKEN:?set a separate staging dashboard token}
      COLLECTION_ENGINE: ${COLLECTION_ENGINE:-historical}
      PUBLIC_COLLECTION_CHECKPOINTS: ${PUBLIC_COLLECTION_CHECKPOINTS:-1}
      WEBSITE_PROBE_DEFAULT_SITEMAPS: ${WEBSITE_PROBE_DEFAULT_SITEMAPS:-1}
      PLAYWRIGHT_FALLBACK_ENABLED: ${PLAYWRIGHT_FALLBACK_ENABLED:-0}
      PLAYWRIGHT_MAX_PAGES_PER_JOB: ${PLAYWRIGHT_MAX_PAGES_PER_JOB:-2}
      M4_COLLECTION_APPROVAL_ENABLED: ${M4_COLLECTION_APPROVAL_ENABLED:-1}
      NAMED_ASSERTION_SECRET: ${NAMED_ASSERTION_SECRET:-}
      # Leave the 7 preset-governed limits unset to inherit AI_TIER_PRESET (on_demand default vs dev).
      AI_TIER_PRESET: ${AI_TIER_PRESET:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_ENDPOINT: ${AI_ENDPOINT:-}
      AI_ALLOWED_ENDPOINTS: ${AI_ALLOWED_ENDPOINTS:-https://api.groq.com/openai/v1/chat/completions}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TIMEOUT_S: ${AI_TIMEOUT_S:-120}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-3}
      AI_BOUNDED_ACCEPTANCE: ${AI_BOUNDED_ACCEPTANCE:-0}
      AI_MODE_A_MAX_OUTPUT_TOKENS: ${AI_MODE_A_MAX_OUTPUT_TOKENS:-}
      AI_MODE_B_MAX_OUTPUT_TOKENS: ${AI_MODE_B_MAX_OUTPUT_TOKENS:-}
      AI_BATCH_SIZE: ${AI_BATCH_SIZE:-}
      AI_MAX_IMAGES_PER_REQUEST: ${AI_MAX_IMAGES_PER_REQUEST:-}
      AI_MAX_IMAGE_DIM: ${AI_MAX_IMAGE_DIM:-512}
      AI_MAX_IMAGE_BYTES: ${AI_MAX_IMAGE_BYTES:-300000}
      AI_MAX_REQUEST_BYTES: ${AI_MAX_REQUEST_BYTES:-1000000}
      AI_MIN_REQUEST_SPACING_S: ${AI_MIN_REQUEST_SPACING_S:-}
      AI_MAX_REQUESTS_PER_JOB: ${AI_MAX_REQUESTS_PER_JOB:-}
      AI_MAX_COST_USD_PER_JOB: ${AI_MAX_COST_USD_PER_JOB:-}
      AI_PRICE_IN_PER_1K: ${AI_PRICE_IN_PER_1K:-0.0008}
      AI_PRICE_OUT_PER_1K: ${AI_PRICE_OUT_PER_1K:-0.004}
    volumes:
      - ${STAGING_MEDIA_DIR:?select a fresh staging-only directory}:/data/projects:rw
      - ../docs/AI_VISUAL_DIRECTOR_V2.md:/srv/docs/AI_VISUAL_DIRECTOR_V2.md:ro
    networks: [worker]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/ready', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3

  n8n:
    <<: *runtime
    image: ${N8N_IMAGE:?set a pinned n8n image}
    mem_limit: 1g
    ports:
      - "127.0.0.1:${STAGING_N8N_ADMIN_PORT:-5680}:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set a fresh staging encryption key}
      N8N_RESTRICT_FILE_ACCESS_TO: /data/media
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_PAYLOAD_SIZE_MAX: "1"
      N8N_FORMDATA_FILE_SIZE_MAX: "1"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://127.0.0.1:5680}
    volumes:
      - n8n_state:/home/node/.n8n
      - ${STAGING_MEDIA_DIR:?select a fresh staging-only directory}:/data/media:ro
      - ../n8n-media:/opt/media-workflows:ro
    depends_on:
      collector:
        condition: service_healthy
    networks: [worker]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz/readiness || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

  dashboard:
    <<: *runtime
    build: ../frontend
    mem_limit: 512m
    environment:
      DASHBOARD_ORIGIN: ${DASHBOARD_ORIGIN:?set the canonical staging HTTPS origin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?set the staging operator password}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:?set an independent random signing secret}
      MEDIA_WORKER_DASHBOARD_TOKEN: ${MEDIA_WORKER_DASHBOARD_TOKEN:?set a separate staging dashboard token}
      NAMED_ASSERTION_SECRET: ${NAMED_ASSERTION_SECRET:-}
      N8N_PIPELINE_TOKEN: ${N8N_PIPELINE_TOKEN:?set the staging pipeline webhook token}
      N8N_ADMIN_WEBHOOK_TOKEN: ${N8N_ADMIN_WEBHOOK_TOKEN:-}
      N8N_ADMIN_WEBHOOK_HEADER: ${N8N_ADMIN_WEBHOOK_HEADER:-X-Admin-Key}
      GOOGLE_DRIVE_READY: ${GOOGLE_DRIVE_READY:-0}
      WORKER_URL: http://collector:8787
      N8N_URL: http://n8n:5678
    depends_on:
      collector:
        condition: service_healthy
      n8n:
        condition: service_healthy
    networks: [edge, worker]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3

  https:
    <<: *runtime
    image: ${CADDY_IMAGE:?set a pinned Caddy image}
    environment:
      STAGING_HOST: ${STAGING_HOST:?set the staging hostname without a port}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "127.0.0.1:${STAGING_HTTPS_PORT:-8443}:443"
    volumes:
      - ${CADDYFILE_PATH:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_state:/data
      - caddy_config:/config
    depends_on:
      dashboard:
        condition: service_healthy
    networks: [edge]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

networks:
  edge:
  worker:

volumes:
  n8n_state:
  caddy_state:
  caddy_config:
