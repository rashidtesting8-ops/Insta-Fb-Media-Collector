name: tests

on:
  push:
    branches: [main, "chore/**", feat/phase9-production-hardening]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend tests, lint, build and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm run test:integration

  offline-pytest:
    name: Offline worker test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg (video preprocessing tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/media-worker/requirements.txt

      - name: Install worker dependencies
        run: pip install -r services/media-worker/requirements.txt

      # Fully offline: in-process HTTP fixtures and mocked tool runners.
      # No network access, no Docker services, no secrets required.
      - name: Run test suite
        env:
          PYTHONPATH: services/media-worker
        run: python -m pytest services/media-worker/tests -q
