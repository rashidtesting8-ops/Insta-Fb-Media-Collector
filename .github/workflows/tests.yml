name: tests

on:
  push:
    branches: [main, "stage4-*", "chore/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    name: Frontend tests, lint, build and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm run test:integration

  n8n-workflows:
    name: n8n workflow contract & Drive v3 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run n8n workflow unit tests
        run: >
          node --test
          n8n-media/canonical-qa-workflow.test.mjs
          n8n-media/approval-qa-workflow.test.mjs
          n8n-media/private-drive-delivery.test.mjs
          n8n-media/sprint4-workflows.test.mjs
      - name: Verify staging workflow sanitizer
        run: node deploy/staging-workflow.mjs > /dev/null

  offline-pytest:
    name: Offline worker test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Ensure ffmpeg and libsodium (video preprocessing & Argon2id auth tests)
        shell: bash
        run: |
          set -euo pipefail
          pkgs=()
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            pkgs+=(ffmpeg)
          fi
          if ! ldconfig -p | grep -q 'libsodium\.so\.23'; then
            pkgs+=(libsodium23)
          fi
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "ffmpeg, ffprobe, and libsodium23 already installed; skipping apt-get."
            exit 0
          fi
          echo "Installing missing system packages: ${pkgs[*]}"
          apt_opts=(-o Acquire::ForceIPv4=true -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          tmp_apt=""
          trap 'rm -rf "${tmp_apt}"' EXIT
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            tmp_apt="$(mktemp -d)"
            cp /etc/apt/sources.list.d/ubuntu.sources "${tmp_apt}/ubuntu.sources"
            apt_opts+=(-o "Dir::Etc::sourceparts=${tmp_apt}")
          elif [ -f /etc/apt/sources.list ]; then
            apt_opts+=(-o Dir::Etc::sourceparts=-)
          fi
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update "${apt_opts[@]}"
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${apt_opts[@]}" "${pkgs[@]}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/media-worker/requirements.txt

      - name: Install worker dependencies
        run: pip install -r services/media-worker/requirements.txt

      # Fully offline: in-process HTTP fixtures and mocked tool runners.
      # No network access, no Docker services, no secrets required.
      - name: Run test suite
        env:
          PYTHONPATH: services/media-worker
        run: python -m pytest services/media-worker/tests -q

  compose-validate:
    name: Validate Docker Compose manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose.media.yml
        env:
          N8N_IMAGE: n8nio/n8n:2.48.7
          N8N_ENCRYPTION_KEY: ci-placeholder-encryption-key-not-real
          MEDIA_WORKER_TOKEN: ci-placeholder-worker-token-not-real
        run: docker compose -f compose.media.yml --profile frontend config --quiet
      - name: Validate deploy/compose.staging.yml
        env:
          N8N_IMAGE: n8nio/n8n:2.48.7
          CADDY_IMAGE: caddy:2.8-alpine
          N8N_ENCRYPTION_KEY: ci-placeholder-encryption-key-not-real
          MEDIA_WORKER_TOKEN: ci-placeholder-worker-token-not-real
          MEDIA_WORKER_DASHBOARD_TOKEN: ci-placeholder-dashboard-token-not-real
          STAGING_MEDIA_DIR: /tmp/staging-media
          DASHBOARD_ORIGIN: https://staging.example.test
          DASHBOARD_PASSWORD: ci-placeholder-password-not-real
          DASHBOARD_SESSION_SECRET: ci-placeholder-session-secret-32bytes
          N8N_PIPELINE_TOKEN: ci-placeholder-pipeline-token-not-real
          STAGING_HOST: staging.example.test
        run: docker compose -f deploy/compose.staging.yml config --quiet
      - name: Validate deploy/compose.staging.yml + deploy/compose.prod.yml
        env:
          N8N_IMAGE: n8nio/n8n:2.48.7
          CADDY_IMAGE: caddy:2.8-alpine
          N8N_ENCRYPTION_KEY: ci-placeholder-encryption-key-not-real
          MEDIA_WORKER_TOKEN: ci-placeholder-worker-token-not-real
          MEDIA_WORKER_DASHBOARD_TOKEN: ci-placeholder-dashboard-token-not-real
          NAMED_ASSERTION_SECRET: ci-placeholder-named-assertion-secret-32b
          STAGING_MEDIA_DIR: /tmp/staging-media
          DASHBOARD_ORIGIN: https://app.example.test
          DASHBOARD_PASSWORD: ci-placeholder-password-not-real
          DASHBOARD_SESSION_SECRET: ci-placeholder-session-secret-32bytes
          N8N_PIPELINE_TOKEN: ci-placeholder-pipeline-token-not-real
          N8N_ADMIN_WEBHOOK_TOKEN: ci-placeholder-admin-webhook-token-32b
          STAGING_HOST: app.example.test
          ACME_EMAIL: ops@example.test
          AI_API_KEY: ci-placeholder-groq-api-key-not-real
        run: docker compose -f deploy/compose.staging.yml -f deploy/compose.prod.yml config --quiet

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository working tree with gitleaks
        run: >
          docker run --rm
          -v "${{ github.workspace }}:/repo:ro"
          zricethezav/gitleaks:latest
          dir /repo --no-banner --redact
